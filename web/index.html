  <link rel="manifest" href="manifest.json?v=4">
  <style>
    /* Flutter 3.41 leaves the host's absolute position implicit. Anchor it
       so WebKit can focus the inputs at their visible coordinates. */
    flutter-view > flt-semantics-host { top: 0; left: 0; }

    /* Prevent WebKit from zooming a focused input with its default text size. */
    .paper-touch-input flutter-view [flt-semantics-identifier="writing-page-body"] textarea,
    .paper-touch-input flutter-view [flt-semantics-identifier="paper-search-input"] input {
      font-size: 16px;
    }

    /* The semantics textarea sits outside Flutter's touch-action pane.
       Leave pan arbitration to the editor and paper recognizers. */
    flutter-view [flt-semantics-identifier="writing-page-body"] textarea { touch-action: none; }

    /* Flutter positions the caret from the painted glyphs on touch screens.
       Its semantic inputs stay focusable for the keyboard and assistive tools. */
    .paper-touch-input flutter-view [flt-semantics-identifier="writing-keyboard-dismiss"],
    .paper-touch-input flutter-view [flt-semantics-identifier="writing-keyboard-dismiss"] *,
    .paper-touch-input flutter-view [flt-semantics-identifier="writing-page-body"],
    .paper-touch-input flutter-view [flt-semantics-identifier="writing-page-body"] textarea,
    .paper-touch-input flutter-view [flt-semantics-identifier="paper-search-input"],
    .paper-touch-input flutter-view [flt-semantics-identifier="paper-search-input"] input {
      pointer-events: none !important;
    }
  </style>
</head>
<body style="margin:0;background:#f8f5ef">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="source_ocr.js?v=4"></script>
  <script>
    if (matchMedia('(any-pointer: coarse)').matches ||
        CSS.supports('-webkit-touch-callout', 'none')) {
      document.documentElement.classList.add('paper-touch-input');
      const fieldSelector = '[flt-semantics-identifier="writing-page-body"], ' +
          '[flt-semantics-identifier="paper-search-input"]';
      // Match Flutter's default touch slop and long-press timeout.
      const touchSlop = 18;
      const longPressMs = 500;
      let tapStart = null;
      let composingField = null;
      document.addEventListener('compositionstart', event => {
        composingField = event.composedPath()[0];
      }, true);
      document.addEventListener('compositionend', event => {
        if (composingField === event.composedPath()[0]) composingField = null;
      }, true);

      function editorAt(event, touch) {
        const path = event.composedPath();
        const view = path.find(node => node.localName === 'flutter-view');
        if (!view || !touch) return null;
        // A separate semantic control retains its own tap behavior.
        const control = path.find(node => node.localName === 'flt-semantics');
        const controlField = control?.closest(fieldSelector);
        if (control && !controlField) return null;
        const editable = path.find(node =>
          node.localName === 'input' || node.localName === 'textarea' ||
          node.isContentEditable);
        for (const field of view.querySelectorAll(fieldSelector)) {
          if (controlField && field !== controlField) continue;
          const editor = field.querySelector('input, textarea');
          if (!editor || editor.disabled || (editable && editable !== editor)) continue;
          const {left, right, top, bottom} = editor.getBoundingClientRect();
          if (touch.clientX >= left && touch.clientX < right &&
              touch.clientY >= top && touch.clientY < bottom) return editor;
        }
        return null;
      }

      function keyboardIsVisible() {
        const viewport = window.visualViewport;
        // Compensate for page zoom. A toolbar resize alone is not a keyboard.
        return viewport && window.innerHeight - viewport.height * viewport.scale > 120;
      }

      document.addEventListener('touchstart', (event) => {
        tapStart = null;
        if (event.touches.length !== 1) return;
        const touch = event.touches[0];
        const editor = editorAt(event, touch);
        if (editor) {
          tapStart = {
            editor, x: touch.clientX, y: touch.clientY,
            id: touch.identifier, time: event.timeStamp, moved: false,
            wasFocused: editor.matches(':focus'),
          };
        }
      }, {capture: true, passive: true});
      document.addEventListener('touchmove', (event) => {
        if (!tapStart) return;
        if (event.touches.length !== 1) {
          tapStart = null;
          return;
        }
        const touch = event.touches[0];
        if (Math.hypot(touch.clientX - tapStart.x, touch.clientY - tapStart.y) > touchSlop) {
          tapStart.moved = true;
        }
      }, {capture: true, passive: true});
      document.addEventListener('touchcancel', () => { tapStart = null; }, true);

      document.addEventListener('touchend', (event) => {
        const start = tapStart;
        tapStart = null;
        if (!start || !event.isTrusted || event.touches.length !== 0) return;
        const touch = event.changedTouches[0];
        if (touch?.identifier !== start.id || editorAt(event, touch) !== start.editor) return;
        if (!composingField?.matches(':focus') && !start.moved &&
            event.timeStamp - start.time < longPressMs &&
            Math.hypot(touch.clientX - start.x, touch.clientY - start.y) <= touchSlop) {
          const focused = start.editor.matches(':focus');
          // WebKit can leave the input focused after hiding the keyboard.
          // Request focus again during the trusted tap when it is closed.
          // If the gesture blurred the editor, preserve Flutter's dismissal.
          if ((!start.wasFocused || focused) && (!focused || !keyboardIsVisible())) {
            start.editor.focus({preventScroll: true});
          }
        }
        // A compatibility click can blur the editor or disturb Flutter selection.
        if (event.cancelable) event.preventDefault();
      }, {capture: true, passive: false});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
