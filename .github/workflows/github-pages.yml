name: Deploy Flutter to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
          cache: true
      - name: Install SQLite test library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool/capture_preview_test.dart tool/capture_cafe_items_test.dart tool/capture_cafe_actions_test.dart tool/capture_cafe_homecoming_test.dart tool/capture_cafe_occlusion_test.dart tool/capture_cafe_atmosphere_test.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=2
      - name: Check the single narration voice DSP in Chrome
        run: node tool/test_narration_web.mjs
      - name: Check cafe image lifetime and room persistence in Chrome
        run: flutter test --no-pub --platform chrome test/cafe_image_lifetime_test.dart test/cafe_space_web_test.dart test/cafe_watercolor_test.dart test/cafe_entry_test.dart test/cafe_items_test.dart test/cafe_material_test.dart test/cafe_actions_test.dart test/cafe_homecoming_test.dart test/cafe_homecoming_flow_test.dart test/cafe_occlusion_test.dart test/cafe_atmosphere_test.dart
      - name: Build Flutter preview
        run: node tool/build_github_pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
