<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 취향으로 쓰고, 한 권으로 남기는 즐거움.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="쓰는 인간">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">

  <title>쓰는 인간</title>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    /* The semantics textarea sits outside Flutter's touch-action pane.
       Leave pan arbitration to the editor and paper recognizers. */
    flutter-view flt-semantics textarea { touch-action: none; }

    @supports (-webkit-touch-callout: none) {
      /* Flutter handles touch selection for the notebook body. Keep its
         semantic textarea available for focus, keyboard and IME events. */
      flutter-view [flt-semantics-identifier="writing-page-body"],
      flutter-view [flt-semantics-identifier="writing-page-body"] textarea {
        pointer-events: none !important;
      }
    }
  </style>
</head>
<body style="margin:0;background:#f8f5ef">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="source_ocr.js?v=3"></script>
  <script>
    if (CSS.supports('-webkit-touch-callout', 'none')) {
      // Preserve the focus Flutter placed on touch release by suppressing the
      // compatibility mouse click over the notebook body.
      document.addEventListener('touchend', (event) => {
        if (event.target.localName !== 'flutter-view' || !event.cancelable) return;
        const editor = event.target.querySelector(
          '[flt-semantics-identifier="writing-page-body"] textarea'
        );
        if (!editor) return;
        const {left, right, top, bottom} = editor.getBoundingClientRect();
        const touch = event.changedTouches[0];
        if (touch && touch.clientX >= left && touch.clientX < right &&
            touch.clientY >= top && touch.clientY < bottom) {
          event.preventDefault();
        }
      }, {capture: true, passive: false});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
