<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 취향으로 쓰고, 한 권으로 남기는 즐거움.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="쓰는 인간">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">

  <title>쓰는 인간</title>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    /* The semantics textarea sits outside Flutter's touch-action pane.
       Leave pan arbitration to the editor and paper recognizers. */
    flutter-view flt-semantics textarea { touch-action: none; }

    @supports (-webkit-touch-callout: none) {
      /* Flutter handles touch selection for the notebook body. Keep its
         semantic textarea available for focus, keyboard and IME events. */
      flutter-view [flt-semantics-identifier="writing-page-body"],
      flutter-view [flt-semantics-identifier="writing-page-body"] textarea {
        pointer-events: none !important;
      }
    }
  </style>
</head>
<body style="margin:0;background:#f8f5ef">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="source_ocr.js?v=4"></script>
  <script>
    if (CSS.supports('-webkit-touch-callout', 'none')) {
      const bodyField = '[flt-semantics-identifier="writing-page-body"] textarea';
      let tapStart = null;
      document.addEventListener('touchstart', (event) => {
        const touch = event.touches[0];
        tapStart = event.touches.length === 1 && event.target.localName === 'flutter-view'
          ? {x: touch.clientX, y: touch.clientY, id: touch.identifier, time: event.timeStamp}
          : null;
      }, {capture: true, passive: true});
      document.addEventListener('touchmove', (event) => {
        const touch = event.touches[0];
        if (tapStart && (event.touches.length !== 1 ||
            Math.hypot(touch.clientX - tapStart.x, touch.clientY - tapStart.y) > 10)) {
          tapStart = null;
        }
      }, {capture: true, passive: true});
      document.addEventListener('touchcancel', () => { tapStart = null; }, true);

      document.addEventListener('touchend', (event) => {
        const start = tapStart;
        tapStart = null;
        if (event.target.localName !== 'flutter-view' || !event.cancelable) return;
        const editor = event.target.querySelector(bodyField);
        const touch = event.changedTouches[0];
        if (!editor || !touch) return;
        const {left, right, top, bottom} = editor.getBoundingClientRect();
        if (touch.clientX < left || touch.clientX >= right ||
            touch.clientY < top || touch.clientY >= bottom) return;

        // Focus during the trusted tap so Safari can open its software keyboard.
        // Flutter still places the caret from the pointer coordinates.
        if (event.isTrusted && start && start.id === touch.identifier &&
            event.timeStamp - start.time < 500 &&
            Math.hypot(touch.clientX - start.x, touch.clientY - start.y) <= 10) {
          editor.focus({preventScroll: true});
        }
        // The compatibility click can blur the field or move its selection.
        event.preventDefault();
      }, {capture: true, passive: false});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
