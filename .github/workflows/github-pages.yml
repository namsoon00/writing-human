name: Deploy Flutter to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'
          cache: true
      - name: Install SQLite test library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool/capture_preview_test.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Flutter preview
        run: node tool/build_github_pages.mjs '${{ steps.pages.outputs.base_path }}/'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
