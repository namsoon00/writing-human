<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 취향으로 쓰고, 한 권으로 남기는 즐거움.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="쓰는 인간">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3">

  <title>쓰는 인간</title>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    /* The semantics textarea sits outside Flutter's touch-action pane.
       Leave pan arbitration to the editor and paper recognizers. */
    flutter-view flt-semantics textarea { touch-action: none; }

    @supports (-webkit-touch-callout: none) {
      /* Flutter handles touch selection for the notebook body. Keep its
         semantic textarea available for focus, keyboard and IME events. */
      flutter-view [flt-semantics-identifier="writing-page-body"],
      flutter-view [flt-semantics-identifier="writing-page-body"] textarea {
        pointer-events: none !important;
      }
    }
  </style>
</head>
<body style="margin:0;background:#f8f5ef">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="source_ocr.js?v=4"></script>
  <script>
    if (CSS.supports('-webkit-touch-callout', 'none')) {
      const body = '[flt-semantics-identifier="writing-page-body"]';
      // Match Flutter's default touch slop and long-press timeout.
      const touchSlop = 18;
      const longPressMs = 500;
      let tapStart = null;
      let composingField = null;
      document.addEventListener('compositionstart', event => {
        composingField = event.composedPath()[0];
      }, true);
      document.addEventListener('compositionend', event => {
        if (composingField === event.composedPath()[0]) composingField = null;
      }, true);

      function editorAt(event, touch) {
        const path = event.composedPath();
        const view = path.find(node => node.localName === 'flutter-view');
        if (!view || !touch) return null;
        // A semantic control above the paper keeps its own touch behavior.
        const control = path.find(node => node.localName === 'flt-semantics');
        if (control && !control.closest(body)) return null;
        const editor = view.querySelector(`${body} textarea`);
        if (!editor || editor.disabled) return null;
        const {left, right, top, bottom} = editor.getBoundingClientRect();
        return touch.clientX >= left && touch.clientX < right &&
          touch.clientY >= top && touch.clientY < bottom ? editor : null;
      }

      document.addEventListener('touchstart', (event) => {
        tapStart = null;
        if (event.touches.length !== 1) return;
        const touch = event.touches[0];
        const editor = editorAt(event, touch);
        if (editor) {
          tapStart = {
            editor, x: touch.clientX, y: touch.clientY,
            id: touch.identifier, time: event.timeStamp, moved: false,
          };
        }
      }, {capture: true, passive: true});
      document.addEventListener('touchmove', (event) => {
        if (!tapStart) return;
        if (event.touches.length !== 1) {
          tapStart = null;
          return;
        }
        const touch = event.touches[0];
        if (Math.hypot(touch.clientX - tapStart.x, touch.clientY - tapStart.y) > touchSlop) {
          tapStart.moved = true;
        }
      }, {capture: true, passive: true});
      document.addEventListener('touchcancel', () => { tapStart = null; }, true);

      document.addEventListener('touchend', (event) => {
        const start = tapStart;
        tapStart = null;
        if (!start || !event.isTrusted || !event.cancelable || event.touches.length !== 0) return;
        const touch = event.changedTouches[0];
        if (touch?.identifier !== start.id || editorAt(event, touch) !== start.editor) return;
        if (!composingField?.matches(':focus') && !start.moved &&
            event.timeStamp - start.time < longPressMs &&
            Math.hypot(touch.clientX - start.x, touch.clientY - start.y) <= touchSlop) {
          // Safari requires focus during the trusted tap. Flutter still places the caret.
          start.editor.focus({preventScroll: true});
        }
        // A compatibility click can blur the editor or disturb Flutter selection.
        event.preventDefault();
      }, {capture: true, passive: false});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
